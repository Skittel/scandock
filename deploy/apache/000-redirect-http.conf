# Port 80: only ACME HTTP-01 challenges, everything else -> HTTPS
<VirtualHost *:80>
    ServerName scankai.site
    ServerAlias *.scankai.site
    DocumentRoot /var/www/letsencrypt

    <Directory /var/www/letsencrypt>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/redirect-error.log
    CustomLog ${APACHE_LOG_DIR}/redirect-access.log combined
</VirtualHost>
