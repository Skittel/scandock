# ScanKai ProFTPD configuration
# Virtual users from MariaDB view scankai.ftp_users; upload-only (no list/read/delete).
ModulePath /usr/lib/proftpd
LoadModule mod_sql.c
LoadModule mod_sql_mysql.c
LoadModule mod_sql_passwd.c
LoadModule mod_tls.c
LoadModule mod_ban.c
LoadModule mod_delay.c
LoadModule mod_xfer.c
LoadModule mod_ls.c

ServerName "ScanKai"
ServerIdent on "ScanKai FTP"
ServerType standalone
DefaultServer on
UseIPv6 on
Port 21
MaxInstances 50
User proftpd
Group nogroup
UseReverseDNS off
RequireValidShell off
DefaultRoot ~
Umask 007 007
AllowOverwrite off
HiddenStores on
MaxStoreFileSize 200 Mb
PassivePorts 40000 40100
TimeoutIdle 300
TimeoutNoTransfer 300
TimeoutStalled 300
MaxLoginAttempts 3

SystemLog /var/log/proftpd/proftpd.log
TransferLog /var/log/proftpd/xferlog
ExtendedLog /var/log/proftpd/auth.log AUTH

# --- Authentication via MariaDB ---
AuthOrder mod_sql.c
SQLBackend mysql
SQLEngine on
SQLAuthenticate users
SQLAuthTypes Crypt
SQLConnectInfo scankai@127.0.0.1:3306 scankai_ftp CHANGE_ME_PASSWORD
SQLMinID 500
SQLNamedQuery get-user SELECT "userid, passwd, 999, 1001, homedir, '/usr/sbin/nologin' FROM ftp_users WHERE userid = '%U'"
SQLUserInfo custom:/get-user
SQLLogFile /var/log/proftpd/sql.log

# --- Upload only: deny everything except storing files ---
<Directory ~>
  <Limit LIST NLST MLSD MLST STAT RETR DELE RNFR RNTO MKD XMKD RMD XRMD SITE APPE MFMT MFF>
    DenyAll
  </Limit>
  <Limit ALL>
    DenyAll
  </Limit>
  <Limit CWD XCWD PWD XPWD CDUP XCUP STOR STOU>
    AllowAll
  </Limit>
</Directory>

# --- TLS (explicit FTPS on 21, optional for old devices) ---
TLSEngine on
TLSLog /var/log/proftpd/tls.log
TLSProtocol TLSv1.2 TLSv1.3
TLSRequired off
TLSECCertificateFile /etc/letsencrypt/live/ftp.scankai.site/fullchain.pem
TLSECCertificateKeyFile /etc/letsencrypt/live/ftp.scankai.site/privkey.pem
TLSCertificateChainFile /etc/letsencrypt/live/ftp.scankai.site/chain.pem
TLSOptions NoSessionReuseRequired
TLSVerifyClient off

# --- Brute force protection ---
BanEngine on
BanLog /var/log/proftpd/ban.log
BanTable /var/run/proftpd/ban.tab
BanOnEvent MaxLoginAttempts 3/00:10:00 01:00:00

# --- Implicit FTPS on 990 ---
<VirtualHost 0.0.0.0>
  Port 990
  ServerName "ScanKai FTPS"
  DefaultRoot ~
  RequireValidShell off
  Umask 007 007
  AllowOverwrite off
  HiddenStores on
  MaxStoreFileSize 200 Mb
  PassivePorts 40000 40100
  AuthOrder mod_sql.c
  SQLBackend mysql
  SQLEngine on
  SQLAuthenticate users
  SQLAuthTypes Crypt
  SQLConnectInfo scankai@127.0.0.1:3306 scankai_ftp CHANGE_ME_PASSWORD
  SQLMinID 500
  SQLNamedQuery get-user SELECT "userid, passwd, 999, 1001, homedir, '/usr/sbin/nologin' FROM ftp_users WHERE userid = '%U'"
  SQLUserInfo custom:/get-user
  TLSEngine on
  TLSProtocol TLSv1.2 TLSv1.3
  TLSRequired on
  TLSECCertificateFile /etc/letsencrypt/live/ftp.scankai.site/fullchain.pem
  TLSECCertificateKeyFile /etc/letsencrypt/live/ftp.scankai.site/privkey.pem
  TLSCertificateChainFile /etc/letsencrypt/live/ftp.scankai.site/chain.pem
  TLSOptions UseImplicitSSL NoSessionReuseRequired
  <Directory ~>
    <Limit LIST NLST MLSD MLST STAT RETR DELE RNFR RNTO MKD XMKD RMD XRMD SITE APPE MFMT MFF>
      DenyAll
    </Limit>
    <Limit ALL>
      DenyAll
    </Limit>
    <Limit CWD XCWD PWD XPWD CDUP XCUP STOR STOU>
      AllowAll
    </Limit>
  </Directory>
</VirtualHost>
