# Replace ADMIN_IPS_HERE with the operator's admin addresses (never ban them).
[proftpd]
enabled  = true
port     = ftp,ftp-data,990,40000:40100
logpath  = /var/log/proftpd/proftpd.log
maxretry = 5
findtime = 10m
bantime  = 1h
ignoreip = 127.0.0.1/8 ::1 ADMIN_IPS_HERE

[sshd]
enabled  = true
ignoreip = 127.0.0.1/8 ::1 ADMIN_IPS_HERE
